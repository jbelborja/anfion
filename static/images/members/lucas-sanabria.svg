<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="p-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d2320"/>
      <stop offset="100%" stop-color="#111614"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#2e5944" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#111614" stop-opacity="0"/>
    </radialGradient>
    <pattern id="arch-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#p-bg)"/>
  <rect width="600" height="800" fill="url(#arch-grid)"/>
  <circle cx="300" cy="340" r="240" fill="url(#halo)"/>

  <!-- Architectural Framing Circle -->
  <circle cx="300" cy="350" r="185" fill="none" stroke="#2e5944" stroke-width="1" stroke-dasharray="4,6" stroke-opacity="0.4"/>
  <circle cx="300" cy="350" r="195" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.15"/>

  <!-- Portrait Silhouette Graphic -->
  <g id="portrait-figure">
    
        <!-- Head contour -->
        <path d="M 245 270 Q 300 200 355 270 L 355 350 Q 300 420 245 350 Z" fill="#d9c8ad" fill-opacity="0.22" stroke="#2e5944" stroke-width="1.5"/>
        <!-- Hair style -->
        <path d="M 240 270 Q 300 190 360 270 L 360 240 Q 300 170 240 240 Z" fill="#2e5944" fill-opacity="0.35"/>
        <!-- Eyes & brow line -->
        <line x1="265" y1="280" x2="288" y2="280" stroke="#ffffff" stroke-width="2"/>
        <line x1="312" y1="280" x2="335" y2="280" stroke="#ffffff" stroke-width="2"/>
        <!-- Architectural trim beard -->
        <path d="M 260 330 Q 300 405 340 330 Q 320 375 300 375 Q 280 375 260 330 Z" fill="#2e5944" fill-opacity="0.25" stroke="#2e5944" stroke-width="1"/>
        <!-- Technical jacket / collar -->
        <path d="M 285 390 L 285 450 L 315 450 L 315 390 Z" fill="#d9c8ad" fill-opacity="0.2"/>
        <path d="M 190 530 L 260 450 L 300 470 L 340 450 L 410 530 Z" fill="#2e5944" fill-opacity="0.18" stroke="#2e5944" stroke-width="1.5"/>
        <path d="M 110 720 C 110 520 170 460 300 460 C 430 460 490 520 490 720 Z" fill="none" stroke="#2e5944" stroke-width="2" stroke-opacity="0.7"/>
        
  </g>

  <!-- Subtle Bottom Foundation Bar -->
  <line x1="80" y1="720" x2="520" y2="720" stroke="#2e5944" stroke-width="1.5" stroke-opacity="0.5"/>
</svg>
