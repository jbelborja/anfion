{{ define "main" }}

<section class="bg-stone-900 text-white py-16 border-b border-stone-800">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <h1 class="text-3xl sm:text-5xl font-serif font-bold text-white mb-4">
      {{ .Title }}
    </h1>
    {{ with .Description }}
      <p class="text-stone-300 text-base max-w-3xl leading-relaxed">{{ . }}</p>
    {{ end }}
  </div>
</section>

<section class="py-16 bg-[#FAF8F5]">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    {{ with .Content }}
      <div class="prose prose-stone prose-lg max-w-3xl mb-12">
        {{ . }}
      </div>
    {{ end }}

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      {{ range .Pages }}
        <article class="bg-white rounded-sm border border-stone-200 p-6 shadow-xs hover:shadow-md transition-shadow">
          <h2 class="text-xl font-serif font-bold text-stone-900 mb-2">
            <a href="{{ .Permalink }}" class="hover:text-brand-700 transition-colors">{{ .Title }}</a>
          </h2>
          <p class="text-stone-600 text-sm line-clamp-3 mb-4 leading-relaxed">
            {{ .Description | default .Summary }}
          </p>
          <a href="{{ .Permalink }}" class="text-xs font-bold uppercase tracking-wider text-brand-700 hover:text-stone-900">
            Leer más →
          </a>
        </article>
      {{ end }}
    </div>
  </div>
</section>

{{ end }}
