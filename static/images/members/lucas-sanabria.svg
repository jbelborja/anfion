<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222624"/>
      <stop offset="100%" stop-color="#121514"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg)"/>
  <rect width="800" height="800" fill="url(#grid)"/>

  <!-- Architectural Content Wireframe -->
  <g id="wireframe">
    
        <!-- Architect Portrait Line Art -->
        <circle cx="400" cy="340" r="100" fill="#2e5944" fill-opacity="0.15" stroke="#2e5944" stroke-width="2"/>
        <!-- Geometric shoulders -->
        <path d="M 220 620 C 220 480 300 460 400 460 C 500 460 580 480 580 620 Z" fill="#2e5944" fill-opacity="0.12" stroke="#2e5944" stroke-width="2"/>
        <!-- Architect glasses / precision mark -->
        <circle cx="370" cy="335" r="24" fill="none" stroke="#ffffff" stroke-width="2"/>
        <circle cx="430" cy="335" r="24" fill="none" stroke="#ffffff" stroke-width="2"/>
        <line x1="394" y1="335" x2="406" y2="335" stroke="#ffffff" stroke-width="2"/>
        
  </g>

  <!-- Card Information Overlay -->
  <g transform="translate(40, 710)">
    <rect x="-10" y="-30" width="460" height="75" rx="3" fill="#181715" fill-opacity="0.75" stroke="#32302b" stroke-width="1"/>
    <text x="10" y="-8" fill="#2e5944" font-size="11" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="2" text-transform="uppercase">BLOWER DOOR LEVEL 2</text>
    <text x="10" y="16" fill="#ffffff" font-size="18" font-family="'Cormorant Garamond', serif" font-weight="700">Lucas Sanabria Varga</text>
    <text x="10" y="34" fill="#a8a29e" font-size="11" font-family="'Inter', sans-serif">Arquitecto Técnico · Especialista EnerPHit</text>
  </g>

  <!-- Studio Watermark -->
  <text x="760" y="45" fill="#ffffff" fill-opacity="0.4" font-size="12" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="3" text-anchor="end">ÁN F I O N</text>
</svg>
