<!DOCTYPE html>
<html lang="{{ site.LanguageCode | default "es" }}" class="scroll-smooth">
<head>
  {{ partial "head.html" . }}
</head>
<body class="bg-[#FAF8F5] text-stone-900 font-sans antialiased flex flex-col min-h-screen selection:bg-brand-600 selection:text-white">
  {{ partial "header.html" . }}

  <main class="flex-grow">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}

  <!-- Theme Script (Gallery Lightbox, Mobile Navigation, Project Filter) -->
  <script src="{{ "js/main.js" | relURL }}"></script>
</body>
</html>
