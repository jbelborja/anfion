<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241f1c"/>
      <stop offset="100%" stop-color="#161311"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="750" fill="url(#bg)"/>
  <rect width="1000" height="750" fill="url(#grid)"/>

  <!-- Architectural Content Wireframe -->
  <g id="wireframe">
    
        <!-- Historic facade with modern eco retrofit -->
        <rect x="160" y="200" width="480" height="480" fill="none" stroke="#b85d38" stroke-width="2" stroke-opacity="0.4"/>
        <!-- Classic arch balcony -->
        <path d="M 220 380 Q 300 260 380 380 L 380 480 L 220 480 Z" fill="#b85d38" fill-opacity="0.1" stroke="#b85d38" stroke-width="1.5"/>
        <path d="M 420 380 Q 500 260 580 380 L 580 480 L 420 480 Z" fill="#b85d38" fill-opacity="0.1" stroke="#b85d38" stroke-width="1.5"/>
        <!-- Wrought iron railings -->
        <line x1="210" y1="480" x2="390" y2="480" stroke="#b85d38" stroke-width="2"/>
        <line x1="410" y1="480" x2="590" y2="480" stroke="#b85d38" stroke-width="2"/>
        <line x1="240" y1="450" x2="360" y2="450" stroke="#b85d38" stroke-width="1" stroke-dasharray="4,4"/>
        <line x1="440" y1="450" x2="560" y2="450" stroke="#b85d38" stroke-width="1" stroke-dasharray="4,4"/>
        <!-- EnerPHit badge -->
        <circle cx="600" cy="240" r="32" fill="#2e5944" stroke="#ffffff" stroke-width="1.5"/>
        <text x="600" y="244" fill="#ffffff" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">EnerPHit</text>
        
  </g>

  <!-- Card Information Overlay -->
  <g transform="translate(40, 660)">
    <rect x="-10" y="-30" width="460" height="75" rx="3" fill="#181715" fill-opacity="0.75" stroke="#32302b" stroke-width="1"/>
    <text x="10" y="-8" fill="#b85d38" font-size="11" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="2" text-transform="uppercase">EXTERIOR</text>
    <text x="10" y="16" fill="#ffffff" font-size="18" font-family="'Cormorant Garamond', serif" font-weight="700">Fachada Restaurada con Madera</text>
    <text x="10" y="34" fill="#a8a29e" font-size="11" font-family="'Inter', sans-serif">Carpinterías de castaño laminado y vidrio bajo emisivo</text>
  </g>

  <!-- Studio Watermark -->
  <text x="960" y="45" fill="#ffffff" fill-opacity="0.4" font-size="12" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="3" text-anchor="end">ÁN F I O N</text>
</svg>
