<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="p-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262022"/>
      <stop offset="100%" stop-color="#161214"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#b85d38" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#161214" stop-opacity="0"/>
    </radialGradient>
    <pattern id="arch-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#p-bg)"/>
  <rect width="600" height="800" fill="url(#arch-grid)"/>
  <circle cx="300" cy="340" r="240" fill="url(#halo)"/>

  <!-- Architectural Framing Circle -->
  <circle cx="300" cy="350" r="185" fill="none" stroke="#b85d38" stroke-width="1" stroke-dasharray="4,6" stroke-opacity="0.4"/>
  <circle cx="300" cy="350" r="195" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.15"/>

  <!-- Portrait Silhouette Graphic -->
  <g id="portrait-figure">
    
        <!-- Hair flowing contour -->
        <path d="M 215 280 C 215 170 385 170 385 280 C 385 420 370 470 360 520 C 330 430 365 310 340 280 Q 300 240 260 280 C 235 310 270 430 240 520 C 230 470 215 420 215 280 Z" fill="#b85d38" fill-opacity="0.22"/>
        <!-- Face oval -->
        <path d="M 255 280 Q 300 395 345 280 Q 345 230 300 230 Q 255 230 255 280 Z" fill="#d9c8ad" fill-opacity="0.25" stroke="#b85d38" stroke-width="1.5"/>
        <!-- Subtle features -->
        <circle cx="280" cy="285" r="3" fill="#ffffff"/>
        <circle cx="320" cy="285" r="3" fill="#ffffff"/>
        <path d="M 288 335 Q 300 345 312 335" fill="none" stroke="#b85d38" stroke-width="1.5"/>
        <!-- Natural linen shirt neckline -->
        <path d="M 288 380 L 288 440 L 312 440 L 312 380 Z" fill="#d9c8ad" fill-opacity="0.2"/>
        <path d="M 170 560 C 230 460 270 440 300 440 C 330 440 370 460 430 560 Z" fill="#b85d38" fill-opacity="0.15" stroke="#b85d38" stroke-width="1.5"/>
        <path d="M 125 720 C 125 530 185 450 300 450 C 415 450 475 530 475 720 Z" fill="none" stroke="#b85d38" stroke-width="2" stroke-opacity="0.7"/>
        
  </g>

  <!-- Subtle Bottom Foundation Bar -->
  <line x1="80" y1="720" x2="520" y2="720" stroke="#b85d38" stroke-width="1.5" stroke-opacity="0.5"/>
</svg>
