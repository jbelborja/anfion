<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26221d"/>
      <stop offset="100%" stop-color="#161411"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="750" fill="url(#bg)"/>
  <rect width="1000" height="750" fill="url(#grid)"/>

  <!-- Architectural Content Wireframe -->
  <g id="wireframe">
    
        <!-- Interior CLT room perspective -->
        <line x1="80" y1="120" x2="320" y2="280" stroke="#a78864" stroke-width="1.5" stroke-opacity="0.5"/>
        <line x1="720" y1="120" x2="480" y2="280" stroke="#a78864" stroke-width="1.5" stroke-opacity="0.5"/>
        <line x1="80" y1="680" x2="320" y2="520" stroke="#a78864" stroke-width="1.5" stroke-opacity="0.5"/>
        <line x1="720" y1="680" x2="480" y2="520" stroke="#a78864" stroke-width="1.5" stroke-opacity="0.5"/>
        <rect x="320" y="280" width="160" height="240" fill="#a78864" fill-opacity="0.08" stroke="#a78864" stroke-width="1.5"/>
        <!-- Ceiling CLT wood slats -->
        <line x1="160" y1="180" x2="640" y2="180" stroke="#d2c0a6" stroke-width="1.5" stroke-opacity="0.5"/>
        <line x1="220" y1="220" x2="580" y2="220" stroke="#d2c0a6" stroke-width="1.5" stroke-opacity="0.5"/>
        <line x1="280" y1="260" x2="520" y2="260" stroke="#d2c0a6" stroke-width="1.5" stroke-opacity="0.5"/>
        <!-- Natural light shaft -->
        <polygon points="360,280 440,280 500,520 300,520" fill="#ffffff" fill-opacity="0.07"/>
        
  </g>

  <!-- Card Information Overlay -->
  <g transform="translate(40, 660)">
    <rect x="-10" y="-30" width="460" height="75" rx="3" fill="#181715" fill-opacity="0.75" stroke="#32302b" stroke-width="1"/>
    <text x="10" y="-8" fill="#a78864" font-size="11" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="2" text-transform="uppercase">INTERIOR</text>
    <text x="10" y="16" fill="#ffffff" font-size="18" font-family="'Cormorant Garamond', serif" font-weight="700">Cocina y Salón con Luz Cenital</text>
    <text x="10" y="34" fill="#a8a29e" font-size="11" font-family="'Inter', sans-serif">Carpinterías ocultas en suelo y conexión con el paisaje</text>
  </g>

  <!-- Studio Watermark -->
  <text x="960" y="45" fill="#ffffff" fill-opacity="0.4" font-size="12" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="3" text-anchor="end">ÁN F I O N</text>
</svg>
